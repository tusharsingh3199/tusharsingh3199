<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-label="Ride the wave. Build the sky.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030918"/><stop offset="0.45" stop-color="#0a2c74"/>
      <stop offset="0.80" stop-color="#2b8ef0"/><stop offset="1" stop-color="#b4f1ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#8fe9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2b8ef0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030918" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#0a2c74" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#030918" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe9ff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe9ff"/><stop offset="1" stop-color="#8fe9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe9ff" stop-opacity="0"/><stop offset="0.5" stop-color="#8fe9ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8fe9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#020718" stop-opacity="0.55"/><stop offset="1" stop-color="#020718" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#8fe9ff" stroke-opacity="0.08"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 0" dur="10s" repeatCount="indefinite"/></pattern>
    <clipPath id="f"><rect width="1280" height="170" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1280" height="170" fill="url(#sky)"/>
    <rect width="1280" height="170" fill="url(#grid)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M-320 108 q80 -22 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0" stroke="#fff" stroke-opacity="0.20" stroke-width="1.2"><animateTransform attributeName="transform" type="translate" from="0 0" to="320 0" dur="26s" repeatCount="indefinite"/></path>
      <path d="M-320 126 q80 -18 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0" stroke="#fff" stroke-opacity="0.32" stroke-width="1.2"><animateTransform attributeName="transform" type="translate" from="320 0" to="0 0" dur="20s" repeatCount="indefinite"/></path>
      <path d="M-320 144 q80 -14 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0" stroke="#fff" stroke-opacity="0.50" stroke-width="1.4"><animateTransform attributeName="transform" type="translate" from="0 0" to="320 0" dur="15s" repeatCount="indefinite"/></path>
    </g>
    <ellipse cx="640" cy="64" rx="470" ry="52" fill="url(#vig)"/>
    <text x="640" y="72" text-anchor="middle" font-family="'Helvetica Neue','Segoe UI',Arial,sans-serif" font-size="22" font-weight="300" letter-spacing="12" fill="#fff" filter="url(#glow)">RIDE THE WAVE · BUILD THE SKY</text>
    <text x="640" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="6" fill="#8fe9ff">// END OF TRANSMISSION</text>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="168.5" rx="14" fill="none" stroke="#8fe9ff" stroke-opacity="0.45"/>
</svg>
